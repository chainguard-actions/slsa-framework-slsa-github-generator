name: Test basic bazel genrule build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Stage helper scripts where the action expects them
        run: |
          # The reusable workflow normally places the builder's scripts at
          # ../__TOOL_ACTION_DIR__ relative to the workspace.
          SRC=""
          for d in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/internal/builders/bazel"; do
            if [ -f "$d/build.sh" ] && [ -f "$d/generate-layout.sh" ]; then
              SRC="$d"; break
            fi
          done
          if [ -z "$SRC" ]; then
            CAND=$(find "$GITHUB_WORKSPACE" -path '*/builders/bazel/generate-layout.sh' -not -path '*/node_modules/*' 2>/dev/null | head -n1)
            if [ -n "$CAND" ]; then SRC=$(dirname "$CAND"); fi
          fi
          if [ -z "$SRC" ]; then
            echo "FAIL: could not locate build.sh / generate-layout.sh"
            exit 1
          fi
          echo "Using helper scripts from: $SRC"
          DEST="$GITHUB_WORKSPACE/../__TOOL_ACTION_DIR__"
          mkdir -p "$DEST"
          for f in build.sh generate-layout.sh; do
            cp "$SRC/$f" "$DEST/$f"
            chmod +x "$DEST/$f"
          done
          ls -la "$DEST"

      - name: Create a minimal Bazel workspace
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf bazel_builder_binaries_to_upload_to_gh_7bc972367cb286b7f36ab4457f06e369
          echo "7.4.1" > .bazelversion
          echo "common --noenable_bzlmod" > .bazelrc
          : > WORKSPACE
          cat > BUILD <<'EOF'
          genrule(
              name = "hello",
              outs = ["hello.txt"],
              cmd = "echo hello-slsa > $@",
          )
          EOF
          cat BUILD

      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: |
            {
              "targets": "//:hello",
              "flags": "",
              "needs-runfiles": "false",
              "includes-java": "false",
              "user-java-distribution": "temurin",
              "user-java-version": "17"
            }
          slsa-layout-file: ${{ runner.temp }}/layout.json

      - name: Assert build artifact and layout
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LAYOUT: ${{ runner.temp }}/layout.json
        run: |
          echo "outcome: $OUTCOME"
          BIN="$GITHUB_WORKSPACE/bazel_builder_binaries_to_upload_to_gh_7bc972367cb286b7f36ab4457f06e369"
          ls -la "$BIN" || true
          # The build step must have produced hello.txt regardless of the
          # artifact upload result.
          if [ ! -f "$BIN/hello.txt" ]; then
            echo "FAIL: expected built artifact $BIN/hello.txt"
            exit 1
          fi
          if [ "$(cat "$BIN/hello.txt")" != "hello-slsa" ]; then
            echo "FAIL: unexpected artifact content: $(cat "$BIN/hello.txt")"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            cat "$LAYOUT"
            EXPECTED=$(sha256sum "$BIN/hello.txt" | awk '{print $1}')
            python3 - "$LAYOUT" "$EXPECTED" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["version"] == 1, d
          atts = d["attestations"]
          assert len(atts) == 1, atts
          a = atts[0]
          assert a["name"] == "hello.txt", a
          assert a["subjects"][0]["name"] == "hello.txt", a
          assert a["subjects"][0]["digest"]["sha256"] == sys.argv[2], a
          print("layout OK")
          EOF
            echo "PASS: action succeeded and layout is valid"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build succeeded; action failed later (artifact upload unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
