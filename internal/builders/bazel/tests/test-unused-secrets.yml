name: Test unused secret inputs are accepted and ignored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Stage helper scripts where the action expects them
        run: |
          SRC=""
          for d in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/internal/builders/bazel"; do
            if [ -f "$d/build.sh" ] && [ -f "$d/generate-layout.sh" ]; then
              SRC="$d"; break
            fi
          done
          if [ -z "$SRC" ]; then
            CAND=$(find "$GITHUB_WORKSPACE" -path '*/builders/bazel/generate-layout.sh' -not -path '*/node_modules/*' 2>/dev/null | head -n1)
            if [ -n "$CAND" ]; then SRC=$(dirname "$CAND"); fi
          fi
          if [ -z "$SRC" ]; then
            echo "FAIL: could not locate build.sh / generate-layout.sh"
            exit 1
          fi
          DEST="$GITHUB_WORKSPACE/../__TOOL_ACTION_DIR__"
          mkdir -p "$DEST"
          for f in build.sh generate-layout.sh; do
            cp "$SRC/$f" "$DEST/$f"
            chmod +x "$DEST/$f"
          done

      - name: Create a minimal Bazel workspace
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf bazel_builder_binaries_to_upload_to_gh_7bc972367cb286b7f36ab4457f06e369
          echo "7.4.1" > .bazelversion
          echo "common --noenable_bzlmod" > .bazelrc
          : > WORKSPACE
          cat > BUILD <<'EOF'
          genrule(
              name = "secret_test",
              outs = ["secret_test.txt"],
              cmd = "echo secrets-ignored > $@",
          )
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: |
            {
              "targets": "//:secret_test",
              "flags": "",
              "needs-runfiles": "false",
              "includes-java": "false",
              "user-java-distribution": "temurin",
              "user-java-version": "17"
            }
          slsa-layout-file: ${{ runner.temp }}/layout.json
          slsa-workflow-secret1: dummy-secret-1
          slsa-workflow-secret2: dummy-secret-2
          slsa-workflow-secret3: dummy-secret-3
          slsa-workflow-secret4: dummy-secret-4
          slsa-workflow-secret5: dummy-secret-5
          slsa-workflow-secret6: dummy-secret-6
          slsa-workflow-secret7: dummy-secret-7
          slsa-workflow-secret8: dummy-secret-8
          slsa-workflow-secret9: dummy-secret-9
          slsa-workflow-secret10: dummy-secret-10
          slsa-workflow-secret11: dummy-secret-11
          slsa-workflow-secret12: dummy-secret-12
          slsa-workflow-secret13: dummy-secret-13
          slsa-workflow-secret14: dummy-secret-14
          slsa-workflow-secret15: dummy-secret-15

      - name: Assert build ran despite unused secrets
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LAYOUT: ${{ runner.temp }}/layout.json
        run: |
          echo "outcome: $OUTCOME"
          BIN="$GITHUB_WORKSPACE/bazel_builder_binaries_to_upload_to_gh_7bc972367cb286b7f36ab4457f06e369"
          ls -la "$BIN" || true
          if [ ! -f "$BIN/secret_test.txt" ]; then
            echo "FAIL: expected built artifact $BIN/secret_test.txt"
            exit 1
          fi
          if [ "$(cat "$BIN/secret_test.txt")" != "secrets-ignored" ]; then
            echo "FAIL: unexpected artifact content"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            cat "$LAYOUT"
            if grep -q "dummy-secret" "$LAYOUT"; then
              echo "FAIL: secret value leaked into layout"
              exit 1
            fi
            grep -q "secret_test.txt" "$LAYOUT" || { echo "FAIL: layout missing artifact"; exit 1; }
            echo "PASS: action succeeded with secrets ignored"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build succeeded; action failed later (artifact upload unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
