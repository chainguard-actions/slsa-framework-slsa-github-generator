name: Test invalid slsa-workflow-inputs JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: "this is not json"
          slsa-layout-file: ${{ runner.temp }}/layout.json

      - name: Assert action failed and produced no layout
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LAYOUT: ${{ runner.temp }}/layout.json
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid JSON inputs"
            exit 1
          fi
          if [ -f "$LAYOUT" ]; then
            echo "FAIL: layout file should not have been created"
            cat "$LAYOUT"
            exit 1
          fi
          echo "PASS"
