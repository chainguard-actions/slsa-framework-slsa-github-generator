name: Test directory traversal is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"jdk-version":"17","directory":"/etc"}'
          slsa-layout-file: slsa-out/layout.json
      - name: Assert action failed and produced no artifact
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.target-download-sha256 }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for directory outside workspace, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SHA" ]; then
            echo "FAIL: no artifact digest expected"
            exit 1
          fi
          echo "PASS"
