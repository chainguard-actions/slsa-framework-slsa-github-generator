name: Test maven build with BYOB workflow secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The secret inputs are accepted (and unused) by the builder. The internal
      # checkout of the sentinel GITHUB_REPOSITORY and the artifact upload may fail
      # under the harness, so accept graceful failure but validate outputs on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"jdk-version":"17","directory":"tests/fixtures/maven-project"}'
          slsa-layout-file: slsa-out/layout.json
          slsa-workflow-secret1: dummy-secret-1
          slsa-workflow-secret2: dummy-secret-2
          slsa-workflow-secret3: dummy-secret-3
          slsa-workflow-secret4: dummy-secret-4
          slsa-workflow-secret5: dummy-secret-5
          slsa-workflow-secret6: dummy-secret-6
          slsa-workflow-secret7: dummy-secret-7
          slsa-workflow-secret8: dummy-secret-8
          slsa-workflow-secret9: dummy-secret-9
          slsa-workflow-secret10: dummy-secret-10
          slsa-workflow-secret11: dummy-secret-11
          slsa-workflow-secret12: dummy-secret-12
          slsa-workflow-secret13: dummy-secret-13
          slsa-workflow-secret14: dummy-secret-14
          slsa-workflow-secret15: dummy-secret-15
      - name: Assert outputs (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME: ${{ steps.action.outputs.target-download-name }}
          SHA: ${{ steps.action.outputs.target-download-sha256 }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $NAME"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$NAME" | grep -qE '^[0-9a-f]{32}-target$'; then
              echo "FAIL: target-download-name malformed"
              exit 1
            fi
            if ! echo "$SHA" | grep -qE '^[0-9a-f]{64}$'; then
              echo "FAIL: target-download-sha256 malformed"
              exit 1
            fi
            echo "PASS: build succeeded with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no artifact runtime)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
