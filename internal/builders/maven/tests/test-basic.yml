name: Test basic maven build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action's internal actions/checkout fetches GITHUB_REPOSITORY, which is a
      # harness sentinel, and the final artifact upload needs the Actions runtime.
      # So the step may fail gracefully; if it succeeds its outputs must be valid.
      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"jdk-version":"17","directory":"tests/fixtures/maven-project"}'
          slsa-layout-file: slsa-out/layout.json
      - name: Assert outputs (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME: ${{ steps.action.outputs.target-download-name }}
          SHA: ${{ steps.action.outputs.target-download-sha256 }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $NAME"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$NAME" | grep -qE '^[0-9a-f]{32}-target$'; then
              echo "FAIL: target-download-name malformed"
              exit 1
            fi
            if ! echo "$SHA" | grep -qE '^[0-9a-f]{64}$'; then
              echo "FAIL: target-download-sha256 malformed"
              exit 1
            fi
            if [ ! -d "$GITHUB_WORKSPACE/target" ]; then
              echo "FAIL: target directory not moved into workspace"
              exit 1
            fi
            echo "PASS: build succeeded with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no artifact runtime)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
