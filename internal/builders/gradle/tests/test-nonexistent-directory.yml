name: Test nonexistent project directory fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"jdk-version":"17","directory":"this-directory-does-not-exist","artifact-list":"build/libs/app.jar"}'
          slsa-layout-file: layout-missing.json
      - name: Assert action failed and produced no build digest
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.build-download-sha256 }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent directory, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SHA" ]; then
            echo "FAIL: build digest should be empty on failure"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/this-directory-does-not-exist" ]; then
            echo "FAIL: directory should not have been created"
            exit 1
          fi
          echo "PASS"
