name: Test workflow secrets are accepted and do not bypass path validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"jdk-version":"17","directory":"/etc","artifact-list":"build/libs/app.jar"}'
          slsa-layout-file: layout-secrets.json
          slsa-workflow-secret1: secret-value-1
          slsa-workflow-secret2: secret-value-2
          slsa-workflow-secret3: secret-value-3
          slsa-workflow-secret4: secret-value-4
          slsa-workflow-secret5: secret-value-5
          slsa-workflow-secret6: secret-value-6
          slsa-workflow-secret7: secret-value-7
          slsa-workflow-secret8: secret-value-8
          slsa-workflow-secret9: secret-value-9
          slsa-workflow-secret10: secret-value-10
          slsa-workflow-secret11: secret-value-11
          slsa-workflow-secret12: secret-value-12
          slsa-workflow-secret13: secret-value-13
          slsa-workflow-secret14: secret-value-14
          slsa-workflow-secret15: secret-value-15
      - name: Assert action failed on path validation and produced no build digest
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.build-download-sha256 }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for directory outside workspace, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SHA" ]; then
            echo "FAIL: build digest should be empty on failure"
            exit 1
          fi
          if [ -s "$GITHUB_WORKSPACE/layout-secrets.json" ]; then
            echo "FAIL: layout file should not have been written"
            exit 1
          fi
          echo "PASS"
