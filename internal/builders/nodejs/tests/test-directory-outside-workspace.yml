name: Test directory outside workspace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Expose builder scripts at ../__TOOL_ACTION_DIR__
        run: |
          src="$GITHUB_WORKSPACE"
          if [ ! -f "$src/build.sh" ]; then
            found="$(find "$GITHUB_WORKSPACE" -path '*builders/nodejs/build.sh' -print -quit)"
            src="$(dirname "$found")"
          fi
          ln -sfn "$src" "$(dirname "$GITHUB_WORKSPACE")/__TOOL_ACTION_DIR__"
          # Create a valid npm package OUTSIDE the workspace.
          mkdir -p /tmp/outside-pkg
          printf '{"name":"outside-pkg","version":"1.0.0"}\n' > /tmp/outside-pkg/package.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"node-version":"20","directory":"/tmp/outside-pkg"}'
          slsa-layout-file: ${{ github.workspace }}/slsa-layout-outside.json

      - name: Assert action failed and produced nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILENAME: ${{ steps.action.outputs.package-filename }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package-filename: $FILENAME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for directory outside workspace"
            exit 1
          fi
          if [ -n "$FILENAME" ]; then
            echo "FAIL: package-filename should be empty"
            exit 1
          fi
          if ls /tmp/outside-pkg/*.tgz >/dev/null 2>&1; then
            echo "FAIL: npm pack ran on an untrusted directory"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/slsa-layout-outside.json" ]; then
            echo "FAIL: layout file should not be created"
            exit 1
          fi
          echo "PASS"
