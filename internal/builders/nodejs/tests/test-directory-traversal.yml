name: Test relative path traversal out of workspace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Expose builder scripts at ../__TOOL_ACTION_DIR__
        run: |
          src="$GITHUB_WORKSPACE"
          if [ ! -f "$src/build.sh" ]; then
            found="$(find "$GITHUB_WORKSPACE" -path '*builders/nodejs/build.sh' -print -quit)"
            src="$(dirname "$found")"
          fi
          ln -sfn "$src" "$(dirname "$GITHUB_WORKSPACE")/__TOOL_ACTION_DIR__"
          # Sibling directory of the workspace containing a valid package.
          sib="$(dirname "$GITHUB_WORKSPACE")/traversal-pkg"
          mkdir -p "$sib"
          printf '{"name":"traversal-pkg","version":"1.0.0"}\n' > "$sib/package.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-inputs: '{"node-version":"20","directory":"../traversal-pkg"}'
          slsa-layout-file: ${{ github.workspace }}/slsa-layout-traversal.json

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILENAME: ${{ steps.action.outputs.package-filename }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package-filename: $FILENAME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for ../ traversal"
            exit 1
          fi
          if [ -n "$FILENAME" ]; then
            echo "FAIL: package-filename should be empty"
            exit 1
          fi
          if ls "$(dirname "$GITHUB_WORKSPACE")/traversal-pkg/"*.tgz >/dev/null 2>&1; then
            echo "FAIL: npm pack ran outside the workspace"
            exit 1
          fi
          echo "PASS"
