name: Test unused secret inputs are accepted and ignored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure xxd is available (needed by the rng sub-action)
        run: |
          if ! command -v xxd >/dev/null 2>&1; then
            (apt-get install -y xxd >/dev/null 2>&1 || sudo apt-get install -y xxd >/dev/null 2>&1) || true
          fi
          if ! command -v xxd >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/xxd-bin"
            cat > "$RUNNER_TEMP/xxd-bin/xxd" <<'EOF'
          #!/bin/sh
          # Minimal xxd -p replacement: plain hex dump of stdin
          od -An -tx1 -v | tr -d ' \n'
          echo
          EOF
            chmod +x "$RUNNER_TEMP/xxd-bin/xxd"
            echo "$RUNNER_TEMP/xxd-bin" >> "$GITHUB_PATH"
            echo "installed xxd shim"
          fi

      - name: Expose builder scripts at ../__TOOL_ACTION_DIR__
        run: |
          src="$GITHUB_WORKSPACE"
          if [ ! -f "$src/build.sh" ]; then
            found="$(find "$GITHUB_WORKSPACE" -path '*builders/nodejs/build.sh' -print -quit)"
            src="$(dirname "$found")"
          fi
          echo "scripts dir: $src"
          ln -sfn "$src" "$(dirname "$GITHUB_WORKSPACE")/__TOOL_ACTION_DIR__"

      - id: action
        uses: .
        with:
          slsa-workflow-inputs: '{"node-version":"20","directory":"tests/fixtures/unscoped-pkg"}'
          slsa-layout-file: ${{ github.workspace }}/slsa-layout-secrets.json
          slsa-workflow-secret1: dummy-secret-1
          slsa-workflow-secret2: dummy-secret-2
          slsa-workflow-secret3: dummy-secret-3
          slsa-workflow-secret4: dummy-secret-4
          slsa-workflow-secret5: dummy-secret-5
          slsa-workflow-secret6: dummy-secret-6
          slsa-workflow-secret7: dummy-secret-7
          slsa-workflow-secret8: dummy-secret-8
          slsa-workflow-secret9: dummy-secret-9
          slsa-workflow-secret10: dummy-secret-10
          slsa-workflow-secret11: dummy-secret-11
          slsa-workflow-secret12: dummy-secret-12
          slsa-workflow-secret13: dummy-secret-13
          slsa-workflow-secret14: dummy-secret-14
          slsa-workflow-secret15: dummy-secret-15

      - name: Assert package-filename
        env:
          ACTUAL: ${{ steps.action.outputs.package-filename }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "plain-test-pkg-0.4.0.tgz" ]; then
            echo "FAIL: expected 'plain-test-pkg-0.4.0.tgz'"
            exit 1
          fi
          echo "PASS"

      - name: Assert attestation-name
        env:
          ACTUAL: ${{ steps.action.outputs.attestation-name }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "plain-test-pkg-0.4.0.build.slsa" ]; then
            echo "FAIL: expected 'plain-test-pkg-0.4.0.build.slsa'"
            exit 1
          fi
          echo "PASS"

      - name: Assert layout file does not leak secrets
        run: |
          f="$GITHUB_WORKSPACE/slsa-layout-secrets.json"
          cat "$f"
          if grep -q 'dummy-secret' "$f"; then
            echo "FAIL: secret value leaked into layout file"
            exit 1
          fi
          subj="$(jq -r '.attestations[0].subjects[0].name' "$f")"
          [ "$subj" = "pkg:npm/plain-test-pkg@0.4.0" ] || { echo "FAIL: subject '$subj'"; exit 1; }
          echo "PASS"
