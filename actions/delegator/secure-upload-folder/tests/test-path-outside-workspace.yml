name: Test path outside workspace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create folder outside workspace
        run: |
          mkdir -p /tmp/outside-folder
          echo "secret" > /tmp/outside-folder/a.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: ${{ github.run_id }}-${{ github.run_attempt }}-outside-artifact
          path: /tmp/outside-folder
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for path outside workspace"
            exit 1
          fi
          echo "PASS"
