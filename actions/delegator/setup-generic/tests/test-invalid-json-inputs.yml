name: Test invalid JSON workflow inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slsa-workflow-recipient: delegator_generic_slsa3.yml
          slsa-build-action-path: ./actions/build-artifacts
          slsa-runner-label: ubuntu-latest
          slsa-workflow-inputs: '{not valid json'
      - name: Assert action failed
        env:
          RESULT: ${{ steps.action.outputs.slsa-token }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed JSON inputs"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: no token expected"
            exit 1
          fi
          echo "PASS"
