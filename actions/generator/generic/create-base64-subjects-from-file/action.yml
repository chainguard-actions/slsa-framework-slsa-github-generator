name: "Secure subjects file sharing generic generator"
description: "Create a list of subjects from a file"
inputs:
  path:
    description: "A path to a file containing the base64-subjects."
    required: true
outputs:
  handle:
    description: "Object handle representing the file."
    value: "${{ steps.object.outputs.base64 }}"

runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Generate random value
      id: rng
      uses: slsa-framework/slsa-github-generator/.github/actions/rng@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0

    - name: Generate random name
      id: name
      shell: bash
      env:
        UNTRUSTED_PATH: "${{ inputs.path }}"
        RNG: "${{ steps.rng.outputs.random }}"
      run: |
        set -euo pipefail

        name=$(basename "${UNTRUSTED_PATH}")
        if [[ -z "${UNTRUSTED_PATH}" ]]; then
          echo "error: empty path"
          exit 1
        fi
        safe_name=$(printf '%s' "${name}" | tr -d '\n\r')
        safe_rng=$(printf '%s' "${RNG}" | tr -d '\n\r')
        echo "artifact_name=${safe_name}-${safe_rng}" >> "$GITHUB_OUTPUT"
        echo "filename=${safe_name}" >> "$GITHUB_OUTPUT"

    - name: Upload file
      id: upload
      uses: slsa-framework/slsa-github-generator/.github/actions/secure-upload-artifact@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
      with:
        name: "${{ steps.name.outputs.artifact_name }}"
        path: "${{ inputs.path }}"

    - name: Create object
      id: object
      shell: bash
      env:
        UNTRUSTED_ARTIFACT_NAME: "${{ steps.name.outputs.artifact_name }}"
        SHA256: "${{ steps.upload.outputs.sha256 }}"
        UNTRUSTED_FILENAME: "${{ steps.name.outputs.filename }}"
      run: |
        set -euo pipefail

        object="{\"artifact_name\": \"${UNTRUSTED_ARTIFACT_NAME}\", \"sha256\": \"${SHA256}\", \"filename\": \"${UNTRUSTED_FILENAME}\"}"

        if test "$RUNNER_OS" = "macOS"
        then
            base64_object=$(echo "$object" | base64)
        else
            base64_object=$(echo "$object" | base64 -w0)
        fi
        echo "$object" | jq
        echo "base64=${base64_object}" >> "$GITHUB_OUTPUT"
