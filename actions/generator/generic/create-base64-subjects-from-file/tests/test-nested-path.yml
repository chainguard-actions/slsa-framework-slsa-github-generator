name: Test nested path uses basename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide xxd shim if missing (act image lacks xxd)
        run: |
          if command -v xxd >/dev/null 2>&1; then
            echo "xxd already available"
            exit 0
          fi
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/xxd <<'EOF'
          #!/usr/bin/env bash
          # Minimal xxd shim supporting plain hex dump (-p/-ps/-plain), -l LEN, -c COLS, optional input file.
          len=""
          cols=30
          file=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -p|-ps|-postscript|-plain) ;;
              -l|-len) len="$2"; shift ;;
              -l*) len="${1#-l}" ;;
              -c|-cols) cols="$2"; shift ;;
              -c*) cols="${1#-c}" ;;
              -*) ;;
              *) file="$1" ;;
            esac
            shift
          done
          if [ -n "$file" ]; then exec 0<"$file"; fi
          if [ -n "$len" ]; then
            data=$(head -c "$len" | od -An -v -tx1 | tr -d ' \n')
          else
            data=$(od -An -v -tx1 | tr -d ' \n')
          fi
          [ "$cols" -le 0 ] 2>/dev/null && cols=30
          w=$((cols * 2))
          i=0
          while [ $i -lt ${#data} ]; do
            echo "${data:$i:$w}"
            i=$((i + w))
          done
          EOF
          chmod +x /tmp/fakebin/xxd
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          head -c 16 /dev/urandom | /tmp/fakebin/xxd -p
      - name: Create nested subjects file
        run: |
          mkdir -p out/dir
          echo "$(echo -n 'deadbeef  file.tar.gz' | base64 -w0)" > out/dir/my-subjects.b64
      - id: action
        uses: .
        with:
          path: out/dir/my-subjects.b64
      - name: Assert filename is basename
        env:
          HANDLE: ${{ steps.action.outputs.handle }}
        run: |
          echo "handle: $HANDLE"
          if [ -z "$HANDLE" ]; then
            echo "FAIL: handle is empty"
            exit 1
          fi
          OBJ="$(echo "$HANDLE" | base64 -d)"
          echo "object: $OBJ"
          FILENAME="$(echo "$OBJ" | jq -r .filename)"
          NAME="$(echo "$OBJ" | jq -r .artifact_name)"
          SHA="$(echo "$OBJ" | jq -r .sha256)"
          if [ "$FILENAME" != "my-subjects.b64" ]; then
            echo "FAIL: filename '$FILENAME'"
            exit 1
          fi
          case "$NAME" in
            my-subjects.b64-?*) ;;
            *) echo "FAIL: artifact_name '$NAME'"; exit 1 ;;
          esac
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{64}$'; then
            echo "FAIL: sha256 '$SHA' invalid"
            exit 1
          fi
          echo "PASS"
