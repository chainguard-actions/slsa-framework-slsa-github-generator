name: Test empty path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ""
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HANDLE: ${{ steps.action.outputs.handle }}
        run: |
          echo "outcome: $OUTCOME"
          echo "handle: $HANDLE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for empty path"
            exit 1
          fi
          if [ -n "$HANDLE" ]; then
            echo "FAIL: handle should be empty"
            exit 1
          fi
          echo "PASS"
