name: Test invalid sha256 fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provenance-download-name: provenance
          provenance-download-sha256: "not-a-valid-sha256"
          build-download-name: build
          build-download-sha256: "also-invalid"
          jdk-version: "17"
          maven-username: test-user
          maven-password: test-pass
          gpg-key-pass: test-passphrase
          gpg-private-key: ""
      - name: Assert action failed on invalid sha256
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid sha256, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
