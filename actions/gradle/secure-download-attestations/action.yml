name: "Secure attestion download for maven builder"
description: "Download the attestations-directory produced by the Maven builder and verify its SHA256"
inputs:
  name:
    description: "Name of provenance directory. This is generated by the Maven builder."
    required: true
  path:
    description: "The path to download the attestations directory into. (Must be under the GITHUB_WORKSPACE)"
    required: true
  sha256:
    description: "SHA256 of the file for verification. This is generated by the Maven builder"
    required: true

runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Download the attestation directory
      uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        sha256: ${{ inputs.sha256 }}
