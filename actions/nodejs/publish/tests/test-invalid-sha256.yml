name: Test invalid sha256 with access and dist-tag fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access: public
          dist-tag: next
          node-auth-token: "not-a-real-npm-token"
          package-name: "my-package-0.0.1.tgz"
          package-download-name: "missing-tarball-artifact"
          package-download-sha256: "not-a-valid-sha256"
          provenance-name: "attestation.intoto.jsonl"
          provenance-download-name: "missing-provenance-artifact"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail with an invalid sha256 / missing artifact"
            exit 1
          fi
          echo "PASS"
